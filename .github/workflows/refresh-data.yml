name: refresh-data

on:
  schedule:
    # Daily at 06:00 UTC 
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Scrape CROUS data
        run: python scripts/scrape.py
        
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paris.json
          # Only commit if there are actual changes to the file
          git diff --cached --quiet || git commit -m "refresh CROUS Paris data"
          git push